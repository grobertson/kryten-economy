# Alembic configuration for kryten-economy (PostgreSQL schema authority).
#
# Sprint 12 decision: Alembic is the SINGLE source of truth for schema changes.
# There is deliberately no hand-rolled `sql/` directory and no custom
# `schema_version` table — `alembic_version` is the version tracker.
#
# The database URL is intentionally NOT stored here (it can contain a secret).
# It is supplied at runtime from the service's `database.postgres` config, exactly
# like the application pool in `kryten_economy/db/pool.py`.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# sqlalchemy.url is supplied by env.py from config/env; see env.py.
sqlalchemy.url =

# Use a timestamp-free, monotonically increasing revision id.
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
