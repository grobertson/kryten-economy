[project]
name = "kryten-economy"
version = "0.16.1"
description = "Channel engagement currency microservice for CyTube channels"
readme = "README.md"
requires-python = ">=3.12,<4.0.0"
license = {text = "MIT"}
authors = [
    {name = "grobertson"},
]
keywords = [
    "cytube",
    "economy",
    "currency",
    "chat",
    "bot",
    "nats",
    "microservice",
    "kryten",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Typing :: Typed",
    "Framework :: AsyncIO",
]
dependencies = [
    "kryten-py>=0.17.3",
    "pyyaml>=6.0,<7.0.0",
    "pydantic>=2.0,<3.0.0",
    "aiohttp>=3.9.0,<4.0.0",
    "croniter>=2.0.0,<3.0.0",
    "asyncpg>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<0.25.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "black>=24.0.0,<25.0.0",
    "ruff>=0.4.0,<1.0.0",
    "mypy>=1.10.0,<2.0.0",
    "build>=1.0.0",
    "twine>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/grobertson/kryten-economy"
Repository = "https://github.com/grobertson/kryten-economy"
Issues = "https://github.com/grobertson/kryten-economy/issues"

[project.scripts]
kryten-economy = "kryten_economy.__main__:main"
kryten-economy-prune = "kryten_economy.prune_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kryten_economy"]

[tool.black]
# The whole tree is formatted at black's default 88, not 100 - the repo has
# been like this since the initial release. Ruff is configured at 100, so the
# two are deliberately allowed to disagree: black decides layout, ruff decides
# lint. Changing this to 100 would reformat every file in the repository.
line-length = 88
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"

# kryten-py ships no py.typed marker, so mypy reports import-untyped for it.
# The package IS installed, so `ignore_missing_imports` does not apply - the
# per-module flag for "installed but untyped" is `follow_imports = skip`,
# scoped to just this one dependency. The rest of the PostgreSQL layer is
# genuinely type-checked. Adding py.typed to kryten-py is the real fix and is
# tracked there.
[[tool.mypy.overrides]]
module = ["kryten", "kryten.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "postgres: requires a live PostgreSQL server (KRYTEN_ECONOMY_TEST_DSN or KRYTEN_ECONOMY_PG_DSN); skipped when neither is set",
]

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20260906",
    "asyncpg-stubs>=0.31.3",
]
